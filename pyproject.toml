[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "noclaw"
version = "0.5.0"
description = "Personal AI assistant — CLI agent, webhooks, channels, scheduled tasks"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
sdk = ["claude-agent-sdk"]
dev = ["pytest", "pytest-asyncio"]

[tool.setuptools.packages.find]
include = ["server*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: requires Claude SDK and API credentials",
]
