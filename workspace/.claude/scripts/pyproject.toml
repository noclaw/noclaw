[project]
name = "noclaw-scripts"
version = "0.3.0"
description = "Agent scripts for NoClaw direct integrations (Gmail, Calendar, Sheets, Docs, Drive, Slack)"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.0.0",
    # Google API integrations
    "google-api-python-client>=2.100.0",
    "google-auth-oauthlib>=1.2.0",
    # Slack integration
    "slack-sdk>=3.27.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.8.0",
    "ruff>=0.2.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
